name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: release-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          package="wireglyph-v${version}-${{ matrix.target }}"
          mkdir "${package}"
          cp "target/${{ matrix.target }}/release/wireglyph" "${package}/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $package = "wireglyph-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\wireglyph.exe" "$package\"
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE "$package\"
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os != 'Windows'
        with:
          name: wireglyph-${{ matrix.target }}
          path: wireglyph-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: wireglyph-${{ matrix.target }}
          path: wireglyph-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-macos:
    name: sign-and-notarize-${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'stoicpickle/wireglyph'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wireglyph-${{ matrix.target }}
          path: unsigned
      - name: Require Apple signing credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_APPLE_ID \
            APPLE_NOTARY_TEAM_ID \
            APPLE_NOTARY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing release-signing environment secret: ${name}"
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          umask 077
          echo "APPLE_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          echo "APPLE_SIGNING_CERTIFICATE=${certificate_path}" >> "${GITHUB_ENV}"
          printf '%s' "${APPLE_DEVELOPER_ID_P12_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          identity_line="$(security find-identity -v -p codesigning "${keychain_path}" | grep '"Developer ID Application:' | head -1 || true)"
          signing_identity="$(awk '{ print $2 }' <<< "${identity_line}")"
          if [[ -z "${signing_identity}" ]]; then
            echo "::error::The P12 does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"
      - name: Sign and notarize macOS archive
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find unsigned -maxdepth 1 -name 'wireglyph-*.tar.gz' -print -quit)"
          if [[ -z "${archive}" ]]; then
            echo "::error::Unsigned macOS archive was not downloaded"
            exit 1
          fi
          tar -xzf "${archive}"
          package="${archive##*/}"
          package="${package%.tar.gz}"
          binary="${package}/wireglyph"

          codesign \
            --force \
            --identifier com.stoicpickle.wireglyph \
            --options runtime \
            --timestamp \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            "${binary}"
          codesign --verify --strict --verbose=2 "${binary}"

          notarization_archive="${package}.zip"
          ditto -c -k --keepParent "${package}" "${notarization_archive}"
          response="$(xcrun notarytool submit "${notarization_archive}" \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --team-id "${APPLE_NOTARY_TEAM_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" \
            --wait \
            --timeout 45m \
            --output-format json)"
          printf '%s\n' "${response}" > notarization-result.json
          submission_id="$(jq -r '.id' notarization-result.json)"
          status="$(jq -r '.status' notarization-result.json)"
          xcrun notarytool log \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --team-id "${APPLE_NOTARY_TEAM_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" \
            "${submission_id}" \
            notarization-log.json
          if [[ "${status}" != "Accepted" ]]; then
            jq '{id, status, statusSummary, issues}' notarization-log.json
            echo "::error::Apple notarization status was ${status}"
            exit 1
          fi
          if ! jq -e '([.issues[]? | select(.severity == "warning" or .severity == "error")] | length) == 0' notarization-log.json >/dev/null; then
            jq '{id, status, statusSummary, issues}' notarization-log.json
            echo "::error::Apple notarization returned warnings or errors"
            exit 1
          fi
          tar -czf "${package}.tar.gz" "${package}"
      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${APPLE_SIGNING_KEYCHAIN}" || true
          fi
          if [[ -n "${APPLE_SIGNING_CERTIFICATE:-}" ]]; then
            rm -f "${APPLE_SIGNING_CERTIFICATE}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wireglyph-signed-${{ matrix.target }}
          path: wireglyph-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-windows:
    name: sign-x86_64-pc-windows-msvc
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'stoicpickle/wireglyph'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wireglyph-x86_64-pc-windows-msvc
          path: unsigned
      - name: Require Windows signing credentials
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            throw "Missing release-signing environment secret: WINDOWS_SIGNING_PFX_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "Missing release-signing environment secret: WINDOWS_SIGNING_PFX_PASSWORD"
          }
      - name: Sign and timestamp Windows executable
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Get-ChildItem "unsigned\wireglyph-*.zip" | Select-Object -First 1
          if (-not $archive) { throw "Unsigned Windows archive was not downloaded" }
          Expand-Archive -Path $archive.FullName -DestinationPath signed
          $package = Get-ChildItem signed -Directory | Select-Object -First 1
          $binary = Join-Path $package.FullName "wireglyph.exe"
          $certificate = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          "WINDOWS_SIGNING_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          )

          $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signTool) {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName |
              Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $signTool) { throw "SignTool was not found on the Windows runner" }

          & $signTool sign `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /f $certificate `
            /p $env:WINDOWS_SIGNING_PFX_PASSWORD `
            $binary
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed" }
          & $signTool verify /pa /all /v $binary
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed" }

          $output = $archive.Name
          Compress-Archive -Path $package.FullName -DestinationPath $output
      - name: Remove temporary Windows credentials
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_CERTIFICATE) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:WINDOWS_SIGNING_CERTIFICATE
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wireglyph-signed-x86_64-pc-windows-msvc
          path: wireglyph-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: publish-attested-release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'stoicpickle/wireglyph'
    needs:
      - build
      - sign-macos
      - sign-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wireglyph-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wireglyph-signed-*
          path: dist
          merge-multiple: true
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum wireglyph-*.tar.gz wireglyph-*.zip > SHA256SUMS
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes --title "Wireglyph ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${release_flags[@]}"
